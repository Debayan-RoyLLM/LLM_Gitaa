# ============================================================================
#  Standalone Docker stack for Qwen3-VL-8B-Instruct.
#    vllm-qwen3vl8b (GPU, port 8009)  ->  litellm-vl (proxy, public 5001)
#
#  Independent of ../docker-compose.yml — different container names, ports
#  and project name, so both stacks can run side by side.
#
#  Run from THIS directory:
#      docker compose -f docker-compose.vl.yml -p qwen3vl up -d
# ============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1) vLLM — Qwen3-VL-8B-Instruct (bf16, dense, multimodal)
  # ---------------------------------------------------------------------------
  vllm-qwen3vl8b:
    # ⚠️ MUST be >= v0.11.0. Older images do not know the
    #    Qwen3VLForConditionalGeneration architecture and fail at load.
    #    Pin the exact tag you validated instead of :latest.
    image: vllm/vllm-openai:v0.11.0
    container_name: vllm-qwen3vl8b
    runtime: nvidia
    environment:
      # GPU 1 — the 35B stack already takes 0.80 of GPU 0. If you have only
      # one GPU, set this to 0 and lower gpu-memory-utilization on both.
      - NVIDIA_VISIBLE_DEVICES=${VL_GPU:-1}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ../models:/models:ro
      - hf-cache-vl:/root/.cache/huggingface
    ipc: host                              # vLLM needs shared memory
    command:
      - "--model=/models/qwen3-vl-8b-instruct"
      - "--served-model-name=qwen3vl8b"
      - "--port=8009"
      - "--api-key=not-needed"
      - "--dtype=bfloat16"
      - "--max-model-len=32768"
      - "--gpu-memory-utilization=0.85"

      # Throughput
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--max-num-seqs=64"
      - "--max-num-batched-tokens=16384"

      # Multimodal caps. limit-mm-per-prompt stops one caller exhausting the
      # context; max_pixels caps how many vision tokens a single image costs
      # (1280*28*28 ≈ 1280 tokens).
      - '--limit-mm-per-prompt={"image":4,"video":1}'
      - '--mm-processor-kwargs={"min_pixels":3136,"max_pixels":1003520}'

      # Tool calling — Qwen3-VL uses the Hermes format, not qwen3_coder.
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"

      # Logging
      - "--uvicorn-log-level=warning"
      - "--max-log-len=128"

      # NOT set for this model (see start_vl.py for the reasoning):
      #   --moe-backend        : dense model, no MoE layers
      #   --speculative-config : no MTP heads
      #   --reasoning-parser   : Instruct variant emits no <think> blocks
      #   --kv-cache-dtype=fp8 : optional, VL quality is more sensitive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      start_period: 300s                   # 8B loads faster than the 35B
      interval: 30s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    # No `ports:` — vLLM has no real auth. Reachable only from LiteLLM.
    # Uncomment for local debugging only:
    # ports:
    #   - "8009:8009"

  # ---------------------------------------------------------------------------
  # 2) LiteLLM — public entrypoint for this model, port 5001
  # ---------------------------------------------------------------------------
  litellm-vl:
    image: ghcr.io/berriai/litellm:main-latest   # pin a tag in production
    container_name: litellm-vl
    depends_on:
      vllm-qwen3vl8b:
        condition: service_healthy
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-internal-key}
    volumes:
      # The .docker variant — its api_base uses the service name, not localhost.
      - ./litellm_config_vl.docker.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "5001"]
    ports:
      - "5001:5001"
    restart: unless-stopped

volumes:
  hf-cache-vl:
