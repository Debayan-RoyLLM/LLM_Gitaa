# ============================================================================
#  PASTE-IN SNIPPET — adds Qwen3-VL to your EXISTING proxy on port 5000.
#
#  This is not a runnable config. Copy the block below into the `model_list:`
#  section of ../litellm_config.yaml (after the qwen9b entry) if you want one
#  proxy serving all three models, instead of the separate proxy on 5001.
#
#  Nothing else in that file needs to change — the per-model overrides here
#  handle everything the global settings get wrong for a vision model.
# ============================================================================

  - model_name: qwen3vl8b
    litellm_params:
      model: openai/qwen3vl8b
      api_base: http://localhost:8009/v1
      api_key: "not-needed"
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      stream: true

      # Per-model override of litellm_settings.request_timeout (120s).
      # Vision prefill is far slower than text — a single high-res image is
      # thousands of vision tokens before the first output token appears.
      timeout: 300

    model_info:
      # REQUIRED. The global `drop_params: true` strips params LiteLLM thinks
      # the model cannot handle. Without this flag it drops image_url content
      # parts and returns a text-only answer with NO error — the failure is
      # silent, which makes it painful to debug.
      supports_vision: true
      supports_function_calling: true
      max_input_tokens: 32768
      max_output_tokens: 4096


# ── Caching ────────────────────────────────────────────────────────────────
# The global `cache:` block in litellm_config.yaml applies to every model,
# including this one. There is no per-model disable.
#
# Base64 images make each request body near-unique: the hit rate is ~0 while
# every entry costs megabytes of Redis. If your callers send inline base64,
# have them opt out per request:
#
#     {"model": "qwen3vl8b", "messages": [...], "cache": {"no-cache": true}}
#
# If they send stable http(s) image URLs instead, leave caching on — those
# bodies repeat and the cache earns its keep.


# ── Quota keys ─────────────────────────────────────────────────────────────
# Existing virtual keys are scoped to specific models (see token_quota.md).
# A key created with models=["qwen35b"] will 401 on qwen3vl8b. Either include
# the new model when creating keys:
#
#     -d '{"user_id":"NAME","max_budget":1.0,"budget_duration":"30d",
#          "models":["qwen35b","qwen3vl8b"]}'
#
# or update an existing key:
#
#     curl -X POST http://localhost:5000/key/update \
#       -H "Authorization: Bearer internal-key" \
#       -H "Content-Type: application/json" \
#       -d '{"key":"sk-...","models":["qwen35b","qwen3vl8b"]}'
