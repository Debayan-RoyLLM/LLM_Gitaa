worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker built-in DNS — enables runtime resolution of compose service names
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- TLS settings ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/gitaa-ai.tail34d33c.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/gitaa-ai.tail34d33c.ts.net.key;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- LLM API (default) ---
        location / {
            set $litellm_upstream http://litellm:5000;
            proxy_pass         $litellm_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 600s;
        }

        # --- User console (basic auth), served under the /user/ prefix ---
        # Literal proxy_pass with a trailing slash => nginx strips the /user/
        # prefix, so the app (which only serves its UI at "/") receives "/"
        # instead of "/user/". The frontend sets BASE=/user so its /api/...
        # calls stay on the same host under the prefix.
        location /user/ {
            auth_basic           "User Management";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass         http://user:8080/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }
    }
    
    server {
        listen 3000 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/gitaa-ai.tail34d33c.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/gitaa-ai.tail34d33c.ts.net.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 100M;          # RAG document uploads

        location / {
            proxy_pass         http://open-webui:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}