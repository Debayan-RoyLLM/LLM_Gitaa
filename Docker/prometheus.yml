# Prometheus configuration for LLM stack
global:
  scrape_interval: 15s        # scrape targets every 15 seconds
  evaluation_interval: 15s

scrape_configs:
  - job_name: "litellm"
    static_configs:
      - targets: ["litellm:5000"]
    # LiteLLM exposes /metrics on the same port as the API
    metrics_path: "/metrics"
