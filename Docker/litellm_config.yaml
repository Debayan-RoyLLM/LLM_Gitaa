model_list:
  # 1. Existing local model route
  - model_name: qwen27b
    litellm_params:
      model: hosted_vllm/qwen27b
      api_base: http://vllm-qwen27b:8007/v1
      api_key: "not-needed"
      #stream: true
      #drop_params: true
      #merge_system_messages: true
    model_info:
      supports_function_calling: true
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001

  # 3. Catch-all wildcard for any other Anthropic model requested by Claude Code
  #- model_name: "*"
  #  litellm_params:
  #    model: openai/qwen35b
  #    api_base: http://vllm-qwen35b:8007/v1
  #    api_key: "not-needed"
  #    stream: true
  #    drop_params: true
  #    merge_system_messages: true

litellm_settings:
  modify_params: true
  num_retries: 3
  request_timeout: 600
  telemetry: false
  #default_max_tokens: 4096
  callbacks: merge_system.merge_system_instance
  drop_params: true                       # Ensure unmapped params are dropped globally
  set_verbose: true

  cache: true
  cache_params:
    type: "redis"
    host: "redis"
    port: 6379
    ttl: 3600

# Rest of your config (router_settings, cache, general_settings)...
router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  retry_after: 2
  timeout: 600
  allowed_fails: 2
  cooldown_time: 60
  enable_pre_call_checks: true

general_settings:
  master_key: "internal-key"
  database_url: "postgresql://litellm:strong-password@postgres:5432/litellm"
  store_model_in_db: true

guardrails:
  - guardrail_name: "block-cc"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      pii_entities_config:
        CREDIT_CARD: "BLOCK"

  - guardrail_name: "pii-mask"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      pii_entities_config:
        EMAIL_ADDRESS: "MASK"
        PHONE_NUMBER: "MASK"
        US_SSN: "MASK"
